services:
  db:
    image: postgres:16-alpine
    container_name: true-duel-db
    environment:
      POSTGRES_DB: true_duel
      POSTGRES_USER: true_duel
      POSTGRES_PASSWORD: true_duel
    ports:
      - "15432:5432"
    volumes:
      - true_duel_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U true_duel -d true_duel"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend/symfony
      dockerfile: Dockerfile
    container_name: true-duel-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_SECRET: true-duel-dev-secret
      ADMIN_API_KEY: true-duel-admin-dev
      DATABASE_URL: pgsql:host=db;port=5432;dbname=true_duel
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: true_duel
      DATABASE_USER: true_duel
      DATABASE_PASSWORD: true_duel
    ports:
      - "8080:8080"
    volumes:
      - ./backend/symfony:/app
    working_dir: /app
    command: >
      sh -lc "php bin/console doctrine:migrations:migrate --no-interaction && php bin/console app:product:seed && php -S 0.0.0.0:8080 -t public public/index.php"

volumes:
  true_duel_db_data:
